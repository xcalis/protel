<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Details - PROTEL Ticket System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-ticket-alt"></i> PROTEL
                </div>
                <button class="mobile-menu-btn">
                    <i class="fas fa-bars"></i>
                </button>
                <nav>
                    <ul>
                        <li><a href="/dashboard">Dashboard</a></li>
                        <li><a href="/tickets">Tickets</a></li>
                        <li><a href="/warnings">Warnings</a></li>
                        <li><a href="/my-achievements">Achievements</a></li>
                        <li class="admin-only"><a href="/admin-panel">Admin Panel</a></li>
                        <li><a href="/logout" id="logout-btn">Logout</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    
    <main>
        <div class="container">
            <div id="ticket-details-container" class="fade-in">
                <!-- Ticket details will be loaded here via JavaScript -->
                <div class="card">
                    <p class="text-center">Loading ticket details...</p>
                </div>
            </div>
            
            <div class="card fade-in" id="complete-ticket-form" style="display: none;">
                <h2 class="mb-2">Complete Ticket</h2>
                
                <div id="error-message" class="mb-2" style="display: none; color: var(--danger);"></div>
                
                <form>
                    <div class="form-group">
                        <label for="resolution-note">Resolution Note (required)</label>
                        <textarea id="resolution-note" name="resolution-note" rows="5" required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <button type="submit" class="btn btn-success btn-block">Mark as Completed</button>
                    </div>
                </form>
            </div>
            
            <div class="text-right mt-3">
                <a href="/tickets" class="btn btn-outline">
                    <i class="fas fa-arrow-left"></i> Back to Tickets
                </a>
            </div>
        </div>
    </main>
    
    <footer>
        <div class="container">
            <div class="footer-content">
                &copy; 2023 PROTEL, Inc. All rights reserved.
            </div>
        </div>
    </footer>
    
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/tickets.js"></script>
    <script src="/static/js/nav.js"></script>
</body>
</html>
