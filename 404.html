<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - PROTEL Ticket System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-ticket-alt"></i> PROTEL
                </div>
            </div>
        </div>
    </header>
    
    <main>
        <div class="container">
            <div class="card text-center fade-in">
                <div class="mb-3" style="font-size: 5rem; color: var(--primary-color);">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <h1 class="mb-2">404 - Page Not Found</h1>
                <p class="mb-3">The page you are looking for does not exist or has been moved.</p>
                <a href="/dashboard" class="btn">Return to Dashboard</a>
            </div>
        </div>
    </main>
    
    <footer>
        <div class="container">
            <div class="footer-content">
                &copy; 2023 PROTEL, Inc. All rights reserved.
            </div>
        </div>
    </footer>
</body>
</html>
