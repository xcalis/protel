<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - PROTEL Ticket System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-ticket-alt"></i> PROTEL
                </div>
                <button class="mobile-menu-btn">
                    <i class="fas fa-bars"></i>
                </button>
                <nav>
                    <ul>
                        <li><a href="/dashboard">Dashboard</a></li>
                        <li><a href="/tickets">Tickets</a></li>
                        <li><a href="/warnings">Warnings</a></li>
                        <li><a href="/my-achievements">Achievements</a></li>
                        <li class="admin-only"><a href="/admin-panel">Admin Panel</a></li>
                        <li><a href="/logout" id="logout-btn" class="active">Logout</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    
    <main>
        <div class="container">
            <div class="card text-center fade-in">
                <h1 class="mb-3">Confirm Logout</h1>
                <p class="mb-3">Are you sure you want to logout?</p>
                
                <div class="form-group">
                    <button id="confirm-logout" class="btn btn-danger mr-1">Yes, Logout</button>
                    <button id="cancel-logout" class="btn btn-outline ml-1">Cancel</button>
                </div>
            </div>
        </div>
    </main>
    
    <footer>
        <div class="container">
            <div class="footer-content">
                &copy; 2023 PROTEL, Inc. All rights reserved.
            </div>
        </div>
    </footer>
    
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/nav.js"></script>
</body>
</html>
